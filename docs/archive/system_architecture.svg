<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 590" width="1060" height="590" role="img" aria-label="RAG Chat — System Architecture">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap');
      text { font-family: 'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif; }
      .title { font-size: 17px; font-weight: 600; letter-spacing: 0.02em; }
      .label { font-size: 11px; font-weight: 500; }
      .sublabel { font-size: 9px; font-weight: 400; fill: #6b7280; }
      .param { font-family: 'IBM Plex Mono', monospace; font-size: 8.5px; font-weight: 500; }
      .group-title { font-size: 10px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; }
      .edge-label { font-size: 8.5px; font-weight: 500; }
      .arrow { stroke-width: 1.6; fill: none; marker-end: url(#ah); }
      .arrow-dash { stroke-width: 1.4; fill: none; stroke-dasharray: 5 3; marker-end: url(#ah-light); }
      .arrow-hit { stroke-width: 1.8; fill: none; stroke-dasharray: 6 3; marker-end: url(#ah-hit); }
    </style>
    <marker id="ah" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
    <marker id="ah-light" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#94a3b8"/>
    </marker>
    <marker id="ah-hit" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#22c55e"/>
    </marker>
    <filter id="s" x="-3%" y="-6%" width="106%" height="116%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-opacity="0.07"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1060" height="590" rx="8" fill="#f8fafc"/>

  <!-- Title -->
  <text x="36" y="36" class="title" fill="#0f172a">RAG Chat — System Architecture</text>
  <line x1="36" y1="48" x2="1024" y2="48" stroke="#e2e8f0" stroke-width="1"/>

  <!-- ═══════════════════════════════════════════════ -->
  <!-- LEGEND (top right)                              -->
  <!-- ═══════════════════════════════════════════════ -->
  <rect x="640" y="14" width="384" height="28" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="0.8"/>
  <!-- Core RAG -->
  <rect x="652" y="21" width="12" height="12" rx="2" fill="#fef3c7" stroke="#fbbf24" stroke-width="0.8"/>
  <text x="668" y="31" class="param" fill="#475569">Core RAG</text>
  <!-- Guardrail -->
  <rect x="728" y="21" width="12" height="12" rx="2" fill="#ffedd5" stroke="#f97316" stroke-width="0.8"/>
  <text x="744" y="31" class="param" fill="#475569">Guardrail</text>
  <!-- Cache -->
  <rect x="802" y="21" width="12" height="12" rx="2" fill="#dbeafe" stroke="#3b82f6" stroke-width="0.8"/>
  <text x="818" y="31" class="param" fill="#475569">Cache</text>
  <!-- Data Store -->
  <rect x="856" y="21" width="12" height="12" rx="2" fill="#fdf2f8" stroke="#f472b6" stroke-width="0.8"/>
  <text x="872" y="31" class="param" fill="#475569">Data Store</text>
  <!-- External -->
  <rect x="936" y="21" width="12" height="12" rx="2" fill="#f5f3ff" stroke="#a78bfa" stroke-width="0.8"/>
  <text x="952" y="31" class="param" fill="#475569">External</text>

  <!-- ═══════════════════════════════════════════════ -->
  <!-- LangSmith annotation (top left)                 -->
  <!-- ═══════════════════════════════════════════════ -->
  <text x="36" y="72" class="sublabel" fill="#7c3aed" font-size="9.5px">📊 LangSmith · tracing — wraps every step</text>

  <!-- ═══════════════════════════════════════════════ -->
  <!-- MAIN FLOW (horizontal, row 1)                   -->
  <!-- ═══════════════════════════════════════════════ -->

  <!-- Gradio UI -->
  <rect x="36" y="88" width="110" height="48" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.2" filter="url(#s)"/>
  <text x="91" y="110" text-anchor="middle" class="label" fill="#1e3a5f">Gradio UI</text>
  <text x="91" y="124" text-anchor="middle" class="sublabel">chat</text>

  <!-- → -->
  <line x1="146" y1="112" x2="180" y2="112" class="arrow" stroke="#475569"/>

  <!-- Input Guard -->
  <rect x="180" y="88" width="130" height="48" rx="6" fill="#ffedd5" stroke="#f97316" stroke-width="1.2" filter="url(#s)"/>
  <text x="245" y="108" text-anchor="middle" class="label" fill="#9a3412">Input Guard</text>
  <text x="245" y="122" text-anchor="middle" class="sublabel">injection scan · local</text>

  <!-- → -->
  <line x1="310" y1="112" x2="344" y2="112" class="arrow" stroke="#475569"/>

  <!-- Query Understanding -->
  <rect x="344" y="88" width="140" height="48" rx="6" fill="#fef3c7" stroke="#fbbf24" stroke-width="1.2" filter="url(#s)"/>
  <text x="414" y="108" text-anchor="middle" class="label" fill="#78350f">Query Understanding</text>
  <text x="414" y="122" text-anchor="middle" class="sublabel">intent + rewrite · Gemini</text>

  <!-- → -->
  <line x1="484" y1="112" x2="518" y2="112" class="arrow" stroke="#475569"/>

  <!-- Semantic Cache -->
  <rect x="518" y="82" width="150" height="60" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.4" filter="url(#s)"/>
  <text x="593" y="106" text-anchor="middle" class="label" fill="#1e40af">Semantic Cache</text>
  <text x="593" y="120" text-anchor="middle" class="param" fill="#1e40af">sim > 0.95</text>

  <!-- miss → -->
  <line x1="668" y1="112" x2="706" y2="112" class="arrow" stroke="#475569"/>
  <text x="678" y="106" class="edge-label" fill="#64748b">miss</text>

  <!-- Hybrid Retrieval -->
  <rect x="706" y="88" width="120" height="48" rx="6" fill="#fef3c7" stroke="#fbbf24" stroke-width="1.2" filter="url(#s)"/>
  <text x="766" y="108" text-anchor="middle" class="label" fill="#78350f">Hybrid Retrieval</text>
  <text x="766" y="122" text-anchor="middle" class="sublabel">two-stage</text>

  <!-- → Top 3 docs -->
  <line x1="826" y1="112" x2="860" y2="112" class="arrow" stroke="#475569"/>
  <text x="834" y="104" class="edge-label" fill="#64748b">Top 3</text>

  <!-- Generate -->
  <rect x="860" y="88" width="100" height="48" rx="6" fill="#fef3c7" stroke="#fbbf24" stroke-width="1.2" filter="url(#s)"/>
  <text x="910" y="108" text-anchor="middle" class="label" fill="#78350f">Generate</text>
  <text x="910" y="122" text-anchor="middle" class="sublabel">streamed · Gemini</text>

  <!-- → -->
  <line x1="960" y1="112" x2="980" y2="112" class="arrow" stroke="#475569"/>

  <!-- Response Guardrail -->
  <rect x="980" y="82" width="56" height="60" rx="6" fill="#ffedd5" stroke="#f97316" stroke-width="1.2" filter="url(#s)"/>
  <text x="1008" y="106" text-anchor="middle" class="label" fill="#9a3412" font-size="9px">Response</text>
  <text x="1008" y="118" text-anchor="middle" class="label" fill="#9a3412" font-size="9px">Guard</text>
  <text x="1008" y="132" text-anchor="middle" class="sublabel">PII</text>

  <!-- ═══════════════════════════════════════════════ -->
  <!-- CACHE HIT fast path (dashed green arc)          -->
  <!-- ═══════════════════════════════════════════════ -->
  <path d="M593,82 L593,66 L1008,66 L1008,82" class="arrow-hit" stroke="#22c55e"/>
  <text x="780" y="62" text-anchor="middle" class="edge-label" fill="#16a34a">hit · &lt; 50 ms</text>

  <!-- ═══════════════════════════════════════════════ -->
  <!-- ROW 2: Inside Hybrid Retrieval (expanded)       -->
  <!-- ═══════════════════════════════════════════════ -->
  <rect x="344" y="168" width="530" height="130" rx="6" fill="#fefce8" stroke="#fde68a" stroke-width="1" stroke-dasharray="5 3"/>
  <text x="360" y="186" class="group-title" fill="#a16207" font-size="9px">Inside Hybrid Retrieval</text>

  <!-- BM25 keyword -->
  <rect x="380" y="202" width="140" height="44" rx="5" fill="#fef3c7" stroke="#fbbf24" stroke-width="1" filter="url(#s)"/>
  <text x="450" y="220" text-anchor="middle" class="label" fill="#78350f">BM25 keyword</text>
  <text x="450" y="234" text-anchor="middle" class="sublabel">rank_bm25 · local</text>

  <!-- Vector dense -->
  <rect x="380" y="258" width="140" height="44" rx="5" fill="#fef3c7" stroke="#fbbf24" stroke-width="1" filter="url(#s)"/>
  <text x="450" y="276" text-anchor="middle" class="label" fill="#78350f">Vector dense</text>
  <text x="450" y="290" text-anchor="middle" class="sublabel">OpenAI emb</text>

  <!-- → RRF Fusion -->
  <line x1="520" y1="224" x2="580" y2="248" class="arrow" stroke="#475569"/>
  <line x1="520" y1="280" x2="580" y2="258" class="arrow" stroke="#475569"/>

  <rect x="580" y="230" width="100" height="44" rx="5" fill="#fef3c7" stroke="#fbbf24" stroke-width="1" filter="url(#s)"/>
  <text x="630" y="248" text-anchor="middle" class="label" fill="#78350f">RRF Fusion</text>
  <text x="630" y="262" text-anchor="middle" class="sublabel">rank merge</text>

  <!-- → BGE Rerank -->
  <line x1="680" y1="252" x2="720" y2="252" class="arrow" stroke="#475569"/>

  <rect x="720" y="230" width="136" height="44" rx="5" fill="#fef3c7" stroke="#d97706" stroke-width="1.2" filter="url(#s)"/>
  <text x="788" y="248" text-anchor="middle" class="label" fill="#78350f">BGE Rerank</text>
  <text x="788" y="262" text-anchor="middle" class="sublabel">v2-m3 · self-hosted</text>

  <!-- connection: main Hybrid Retrieval → sub-group -->
  <path d="M766,136 L766,168" class="arrow-dash" stroke="#94a3b8"/>

  <!-- ═══════════════════════════════════════════════ -->
  <!-- ROW 3: Infrastructure (storage cylinders)       -->
  <!-- ═══════════════════════════════════════════════ -->

  <!-- ── Redis (cylinder) ── -->
  <g transform="translate(120, 360)">
    <path d="M0,14 C0,6 22,0 50,0 C78,0 100,6 100,14 L100,50 C100,58 78,64 50,64 C22,64 0,58 0,50 Z" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.2"/>
    <ellipse cx="50" cy="14" rx="50" ry="14" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.2"/>
    <text x="50" y="40" text-anchor="middle" class="label" fill="#1e40af">Redis</text>
    <text x="50" y="54" text-anchor="middle" class="sublabel">queue + cache</text>
  </g>
  <!-- Redis ↔ Cache -->
  <path d="M170,360 L170,340 L593,340 L593,142" class="arrow-dash" stroke="#3b82f6"/>
  <text x="380" y="336" text-anchor="middle" class="edge-label" fill="#2563eb">read / write</text>

  <!-- ── Pinecone (cylinder) ── -->
  <g transform="translate(370, 360)">
    <path d="M0,14 C0,6 22,0 50,0 C78,0 100,6 100,14 L100,50 C100,58 78,64 50,64 C22,64 0,58 0,50 Z" fill="#fdf2f8" stroke="#f472b6" stroke-width="1.2"/>
    <ellipse cx="50" cy="14" rx="50" ry="14" fill="#fdf2f8" stroke="#f472b6" stroke-width="1.2"/>
    <text x="50" y="40" text-anchor="middle" class="label" fill="#831843">Pinecone</text>
    <text x="50" y="54" text-anchor="middle" class="sublabel">vector index</text>
  </g>
  <!-- Pinecone ↔ Vector dense -->
  <path d="M420,360 L420,302" class="arrow-dash" stroke="#f472b6"/>
  <text x="428" y="334" class="edge-label" fill="#c026d3">query</text>

  <!-- ── SQLite (cylinder) ── -->
  <g transform="translate(620, 360)">
    <path d="M0,14 C0,6 22,0 50,0 C78,0 100,6 100,14 L100,50 C100,58 78,64 50,64 C22,64 0,58 0,50 Z" fill="#fdf2f8" stroke="#f472b6" stroke-width="1.2"/>
    <ellipse cx="50" cy="14" rx="50" ry="14" fill="#fdf2f8" stroke="#f472b6" stroke-width="1.2"/>
    <text x="50" y="40" text-anchor="middle" class="label" fill="#831843">SQLite</text>
    <text x="50" y="54" text-anchor="middle" class="sublabel">conversation logs</text>
  </g>
  <!-- SQLite ← Response Guard -->
  <path d="M720,390 L1008,390 L1008,142" class="arrow-dash" stroke="#f472b6"/>
  <text x="890" y="384" text-anchor="middle" class="edge-label" fill="#c026d3">logs</text>

  <!-- ═══════════════════════════════════════════════ -->
  <!-- ROW 4: Document Ingestion                       -->
  <!-- ═══════════════════════════════════════════════ -->
  <rect x="36" y="460" width="700" height="120" rx="6" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1"/>
  <text x="52" y="480" class="group-title" fill="#5b21b6">Document Ingestion</text>

  <!-- Upload sources (left) -->
  <rect x="56" y="496" width="50" height="26" rx="4" fill="#ede9fe" stroke="#a78bfa" stroke-width="0.8"/>
  <text x="81" y="513" text-anchor="middle" class="label" fill="#5b21b6">PDF</text>
  <rect x="56" y="528" width="50" height="26" rx="4" fill="#ede9fe" stroke="#a78bfa" stroke-width="0.8"/>
  <text x="81" y="545" text-anchor="middle" class="label" fill="#5b21b6">Excel</text>
  <rect x="56" y="560" width="50" height="26" rx="4" fill="#ede9fe" stroke="#a78bfa" stroke-width="0.8"/>
  <text x="81" y="577" text-anchor="middle" class="label" fill="#5b21b6">CSV</text>

  <!-- Files → Worker -->
  <line x1="106" y1="509" x2="150" y2="530" class="arrow" stroke="#7c3aed"/>
  <line x1="106" y1="541" x2="150" y2="535" class="arrow" stroke="#7c3aed"/>
  <line x1="106" y1="573" x2="150" y2="540" class="arrow" stroke="#7c3aed"/>

  <!-- Ingestion Worker (center) -->
  <rect x="150" y="504" width="160" height="50" rx="5" fill="#ede9fe" stroke="#a78bfa" stroke-width="1" filter="url(#s)"/>
  <text x="230" y="524" text-anchor="middle" class="label" fill="#5b21b6">Ingestion Worker</text>
  <text x="230" y="540" text-anchor="middle" class="sublabel">RQ · chunk → embed → upsert</text>

  <!-- Worker → Redis (uses queue): Worker top (190,504) → Redis bottom (170,424) -->
  <path d="M190,504 L190,460 L170,460 L170,424" class="arrow-dash" stroke="#a78bfa"/>
  <text x="198" y="478" class="edge-label" fill="#7c3aed">uses queue</text>

  <!-- Worker → Pinecone (upsert / delete): Worker right (310,520) → Pinecone bottom center (420,424) -->
  <path d="M310,520 L420,520 L420,424" class="arrow" stroke="#7c3aed"/>
  <text x="428" y="476" class="edge-label" fill="#7c3aed">upsert / delete</text>

  <!-- BM25 Index (right) -->
  <rect x="540" y="512" width="90" height="30" rx="4" fill="#fef3c7" stroke="#fbbf24" stroke-width="0.8"/>
  <text x="585" y="531" text-anchor="middle" class="label" fill="#78350f" font-size="9.5px">BM25 Index</text>

  <!-- Worker → BM25 Index (rebuild): Worker right (310,540) → BM25 left center (540,527) -->
  <path d="M310,540 L440,540 L440,527 L540,527" class="arrow" stroke="#7c3aed"/>
  <text x="460" y="550" class="edge-label" fill="#7c3aed">rebuild</text>

</svg>