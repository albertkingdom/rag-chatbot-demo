# Provisioned so the dashboard works without a manual import. The fixed uid is
# referenced by every panel in monitoring/grafana/dashboards/rag-slo.json.
apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 15s
