# Loads every dashboard JSON under /etc/grafana/dashboards (mounted from
# monitoring/grafana/dashboards by docker-compose.yml).
apiVersion: 1

providers:
  - name: rag-slo
    orgId: 1
    folder: ""
    type: file
    disableDeletion: false
    allowUiUpdates: false
    updateIntervalSeconds: 30
    options:
      path: /etc/grafana/dashboards
