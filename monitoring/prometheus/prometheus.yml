# Local Prometheus for the docker-compose stack (spec: metrics-endpoint-exposure).
# It scrapes the web service over the compose network; the web service serves
# /metrics only because docker-compose.yml sets METRICS_ENABLED=true.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

# An explicit file, not a glob: this directory also holds slo_test.yml, the
# promtool test file, which Prometheus must not try to load as rules.
rule_files:
  - /etc/prometheus/rules/slo.yml

scrape_configs:
  - job_name: rag-web
    metrics_path: /metrics
    static_configs:
      - targets: ["web:80"]
