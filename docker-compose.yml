services:
  web:
    build: .
    container_name: carbon-assistant-app
    ports:
      - "8000:80"
    volumes:
      - .:/app
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - PINECONE_API_KEY=${PINECONE_API_KEY}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - LANGCHAIN_TRACING_V2=${LANGCHAIN_TRACING_V2}
      - LANGCHAIN_ENDPOINT=${LANGCHAIN_ENDPOINT}
      - LANGCHAIN_API_KEY=${LANGCHAIN_API_KEY}
      - LANGCHAIN_PROJECT=${LANGCHAIN_PROJECT}
      - REDIS_URL=redis://redis:6379/0
      - MONGODB_URL=mongodb://mongodb:27017/chatbot
      - JOB_RUNNER=local
      - APP_API_KEY=${APP_API_KEY:-}
      - AUTH_ENABLED=${AUTH_ENABLED:-true}
      - RATE_LIMIT_RPM=${RATE_LIMIT_RPM:-60}
      - SESSION_TTL_SECONDS=${SESSION_TTL_SECONDS:-86400}
    depends_on:
      - redis
      - mongodb

  redis-insight:
    image: redis/redisinsight:latest
    container_name: carbon-assistant-redisinsight
    ports:
      - "8001:5540"
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    container_name: carbon-assistant-redis

  mongodb:
    image: mongo:7
    container_name: carbon-assistant-mongodb
    environment:
      - MONGO_INITDB_DATABASE=chatbot
    volumes:
      - mongodb_data:/data/db
    ports:
      - "27017:27017"

  mongo-express:
    image: mongo-express:latest
    container_name: carbon-assistant-mongo-express
    ports:
      - "8081:8081"
    environment:
      - ME_CONFIG_MONGODB_URL=mongodb://mongodb:27017/
      - ME_CONFIG_BASICAUTH_USERNAME=admin
      - ME_CONFIG_BASICAUTH_PASSWORD=pass
    depends_on:
      - mongodb

  worker:
    build: .
    container_name: carbon-assistant-worker
    command: rq worker --with-scheduler -u redis://redis:6379/0
    volumes:
      - .:/app
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - PINECONE_API_KEY=${PINECONE_API_KEY}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - LANGCHAIN_TRACING_V2=${LANGCHAIN_TRACING_V2}
      - LANGCHAIN_ENDPOINT=${LANGCHAIN_ENDPOINT}
      - LANGCHAIN_API_KEY=${LANGCHAIN_API_KEY}
      - LANGCHAIN_PROJECT=${LANGCHAIN_PROJECT}
      - REDIS_URL=redis://redis:6379/0
      - MONGODB_URL=mongodb://mongodb:27017/chatbot
      - APP_API_KEY=${APP_API_KEY:-}
      - AUTH_ENABLED=${AUTH_ENABLED:-true}
      - RATE_LIMIT_RPM=${RATE_LIMIT_RPM:-60}
      - SESSION_TTL_SECONDS=${SESSION_TTL_SECONDS:-86400}
    depends_on:
      - redis
      - mongodb

volumes:
  mongodb_data: