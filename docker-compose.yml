services:
  web:
    build: .
    container_name: rag-demo-app
    ports:
      - "8000:80"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - PINECONE_API_KEY=${PINECONE_API_KEY}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - LANGCHAIN_TRACING_V2=${LANGCHAIN_TRACING_V2}
      - LANGCHAIN_ENDPOINT=${LANGCHAIN_ENDPOINT}
      - LANGCHAIN_API_KEY=${LANGCHAIN_API_KEY}
      - LANGCHAIN_PROJECT=${LANGCHAIN_PROJECT}
      - REDIS_URL=redis://redis:6379/0
      - MONGODB_URL=mongodb://mongodb:27017/chatbot
      - JOB_RUNNER=local
      - FRONTEND_MODE=spa
      - DATA_SOURCE_DIR=/app/uploaded_files
      - BM25_INDEX_DIR=/app/bm25
      - APP_PUBLIC_ORIGIN=${APP_PUBLIC_ORIGIN:-}
      - MAX_UPLOAD_BYTES=${MAX_UPLOAD_BYTES:-26214400}
      - APP_API_KEY=${APP_API_KEY:-}
      - AUTH_ENABLED=${AUTH_ENABLED:-true}
      - RATE_LIMIT_RPM=${RATE_LIMIT_RPM:-60}
      - SESSION_TTL_SECONDS=${SESSION_TTL_SECONDS:-86400}
      - CHAT_HISTORY_TTL_SECONDS=${CHAT_HISTORY_TTL_SECONDS:-1800}
      - CHAT_HISTORY_MAX_TURNS=${CHAT_HISTORY_MAX_TURNS:-3}
    volumes:
      - manual_data:/app/uploaded_files
      - bm25_data:/app/bm25
    depends_on:
      - redis
      - mongodb

  redis-insight:
    image: redis/redisinsight:latest
    container_name: rag-demo-redisinsight
    ports:
      - "8001:5540"
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    container_name: rag-demo-redis

  mongodb:
    image: mongo:7
    container_name: rag-demo-mongodb
    environment:
      - MONGO_INITDB_DATABASE=chatbot
    volumes:
      - mongodb_data:/data/db
    ports:
      - "27017:27017"

  mongo-express:
    image: mongo-express:latest
    container_name: rag-demo-mongo-express
    ports:
      - "8081:8081"
    environment:
      - ME_CONFIG_MONGODB_URL=mongodb://mongodb:27017/
      - ME_CONFIG_BASICAUTH_USERNAME=admin
      - ME_CONFIG_BASICAUTH_PASSWORD=pass
    depends_on:
      - mongodb

  worker:
    build: .
    container_name: rag-demo-worker
    command: rq worker --with-scheduler -u redis://redis:6379/0
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - PINECONE_API_KEY=${PINECONE_API_KEY}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - LANGCHAIN_TRACING_V2=${LANGCHAIN_TRACING_V2}
      - LANGCHAIN_ENDPOINT=${LANGCHAIN_ENDPOINT}
      - LANGCHAIN_API_KEY=${LANGCHAIN_API_KEY}
      - LANGCHAIN_PROJECT=${LANGCHAIN_PROJECT}
      - REDIS_URL=redis://redis:6379/0
      - MONGODB_URL=mongodb://mongodb:27017/chatbot
      - DATA_SOURCE_DIR=/app/uploaded_files
      - BM25_INDEX_DIR=/app/bm25
      - APP_API_KEY=${APP_API_KEY:-}
      - AUTH_ENABLED=${AUTH_ENABLED:-true}
      - RATE_LIMIT_RPM=${RATE_LIMIT_RPM:-60}
      - SESSION_TTL_SECONDS=${SESSION_TTL_SECONDS:-86400}
      - CHAT_HISTORY_TTL_SECONDS=${CHAT_HISTORY_TTL_SECONDS:-1800}
      - CHAT_HISTORY_MAX_TURNS=${CHAT_HISTORY_MAX_TURNS:-3}
    volumes:
      - manual_data:/app/uploaded_files
      - bm25_data:/app/bm25
    depends_on:
      - redis
      - mongodb

volumes:
  manual_data:
  bm25_data:
  mongodb_data:
