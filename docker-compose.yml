services:
  web:
    build: .
    container_name: rag-demo-app
    ports:
      - "8000:80"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - PINECONE_API_KEY=${PINECONE_API_KEY}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - LANGCHAIN_TRACING_V2=${LANGCHAIN_TRACING_V2}
      - LANGCHAIN_ENDPOINT=${LANGCHAIN_ENDPOINT}
      - LANGCHAIN_API_KEY=${LANGCHAIN_API_KEY}
      - LANGCHAIN_PROJECT=${LANGCHAIN_PROJECT}
      - REDIS_URL=redis://redis:6379/0
      - MONGODB_URL=mongodb://mongodb:27017/chatbot
      - JOB_RUNNER=local
      - DATA_SOURCE_DIR=/app/uploaded_files
      - BM25_INDEX_DIR=/app/bm25
      - PINECONE_INDEX_NAME=${PINECONE_INDEX_NAME:-rag-demo-qa-index}
      - APP_PUBLIC_ORIGIN=${APP_PUBLIC_ORIGIN:-}
      - MAX_UPLOAD_BYTES=${MAX_UPLOAD_BYTES:-26214400}
      - APP_API_KEY=${APP_API_KEY:-}
      - AUTH_ENABLED=${AUTH_ENABLED:-true}
      - RATE_LIMIT_RPM=${RATE_LIMIT_RPM:-60}
      - SESSION_TTL_SECONDS=${SESSION_TTL_SECONDS:-86400}
      - CHAT_HISTORY_TTL_SECONDS=${CHAT_HISTORY_TTL_SECONDS:-1800}
      - GUARDRAIL_ALLOWED_EMAIL_DOMAINS=${GUARDRAIL_ALLOWED_EMAIL_DOMAINS-example.com}
      - CHAT_HISTORY_MAX_TURNS=${CHAT_HISTORY_MAX_TURNS:-3}
      # Local stack only: Prometheus scrapes web:80/metrics over the compose
      # network. The Cloud Run deployment (terraform/) never sets this.
      - METRICS_ENABLED=true
      # Reranking calls Vertex AI Ranking with your application default
      # credentials (`gcloud auth application-default login`) in this project.
      - GCP_PROJECT_ID=${GCP_PROJECT_ID:-}
      - GOOGLE_APPLICATION_CREDENTIALS=/app/gcloud/application_default_credentials.json
    volumes:
      - manual_data:/app/uploaded_files
      - bm25_data:/app/bm25
      # Long syntax with create_host_path: false, so a missing credentials file
      # is an error instead of Docker creating a directory in its place.
      - type: bind
        source: ${GOOGLE_ADC_FILE:-${HOME}/.config/gcloud/application_default_credentials.json}
        target: /app/gcloud/application_default_credentials.json
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      - redis
      - mongodb

  redis-insight:
    image: redis/redisinsight:latest
    container_name: rag-demo-redisinsight
    ports:
      - "8001:5540"
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    container_name: rag-demo-redis

  mongodb:
    image: mongo:7
    container_name: rag-demo-mongodb
    environment:
      - MONGO_INITDB_DATABASE=chatbot
    volumes:
      - mongodb_data:/data/db
    ports:
      - "27017:27017"

  mongo-express:
    image: mongo-express:latest
    container_name: rag-demo-mongo-express
    ports:
      - "8081:8081"
    environment:
      - ME_CONFIG_MONGODB_URL=mongodb://mongodb:27017/
      - ME_CONFIG_BASICAUTH_USERNAME=admin
      - ME_CONFIG_BASICAUTH_PASSWORD=pass
    depends_on:
      - mongodb

  worker:
    build: .
    container_name: rag-demo-worker
    command: rq worker --with-scheduler -u redis://redis:6379/0
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - PINECONE_API_KEY=${PINECONE_API_KEY}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - LANGCHAIN_TRACING_V2=${LANGCHAIN_TRACING_V2}
      - LANGCHAIN_ENDPOINT=${LANGCHAIN_ENDPOINT}
      - LANGCHAIN_API_KEY=${LANGCHAIN_API_KEY}
      - LANGCHAIN_PROJECT=${LANGCHAIN_PROJECT}
      - REDIS_URL=redis://redis:6379/0
      - MONGODB_URL=mongodb://mongodb:27017/chatbot
      - DATA_SOURCE_DIR=/app/uploaded_files
      - BM25_INDEX_DIR=/app/bm25
      - PINECONE_INDEX_NAME=${PINECONE_INDEX_NAME:-rag-demo-qa-index}
      - APP_API_KEY=${APP_API_KEY:-}
      - AUTH_ENABLED=${AUTH_ENABLED:-true}
      - RATE_LIMIT_RPM=${RATE_LIMIT_RPM:-60}
      - SESSION_TTL_SECONDS=${SESSION_TTL_SECONDS:-86400}
      - CHAT_HISTORY_TTL_SECONDS=${CHAT_HISTORY_TTL_SECONDS:-1800}
      - CHAT_HISTORY_MAX_TURNS=${CHAT_HISTORY_MAX_TURNS:-3}
    volumes:
      - manual_data:/app/uploaded_files
      - bm25_data:/app/bm25
    depends_on:
      - redis
      - mongodb

  # Local monitoring (spec: metrics-endpoint-exposure, service-level-metrics).
  # Image tags are pinned on purpose; the CI promtool job must use the same
  # Prometheus tag.
  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: rag-demo-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # Longer than the 28-day SLO window so the error-budget panel has data.
      - --storage.tsdb.retention.time=30d
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    depends_on:
      - web

  grafana:
    image: grafana/grafana:12.1.0
    container_name: rag-demo-grafana
    ports:
      - "3000:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  manual_data:
  bm25_data:
  mongodb_data:
  prometheus_data:
  grafana_data:
