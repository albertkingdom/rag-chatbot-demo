services:
  web:
    build: .
    container_name: carbon-assistant-app
    ports:
      - "8000:80"
    volumes:
      - .:/app
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - PINECONE_API_KEY=${PINECONE_API_KEY}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis

  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: carbon-assistant-redis-gui
    environment:
      - REDIS_HOSTS=local:redis:6379
    ports:
      - "8081:8081"
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    container_name: carbon-assistant-redis

  worker:
    build: .
    container_name: carbon-assistant-worker
    command: rq worker --with-scheduler -u redis://redis:6379/0
    volumes:
      - .:/app
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - PINECONE_API_KEY=${PINECONE_API_KEY}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis