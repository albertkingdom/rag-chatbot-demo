name: Deploy to Cloud Run

# Deploy only from release branches; pushes to master do NOT trigger.
on:
  push:
    branches:
      - 'release/**'

# Required for Workload Identity Federation (OIDC token).
permissions:
  contents: read
  id-token: write

env:
  REGION: asia-east1
  REPO: carbon-assistant
  IMAGE_NAME: carbon-assistant

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to GCP (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Build and push image (tagged with git SHA)
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${REPO}/${IMAGE_NAME}:${GITHUB_SHA}"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      # Backend bucket is configured in terraform/backend.tf (manual, task 1.2).
      - name: Terraform init & apply
        working-directory: terraform
        run: |
          terraform init
          terraform apply -auto-approve \
            -var="project_id=${{ secrets.GCP_PROJECT_ID }}" \
            -var="region=${REGION}" \
            -var="image_tag=${GITHUB_SHA}" \
            -var="github_repository=${GITHUB_REPOSITORY}"
