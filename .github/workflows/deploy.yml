name: Deploy to Cloud Run

# Deploy only from release branches; pushes to master do NOT trigger.
on:
  push:
    branches:
      - 'release/**'

# Required for Workload Identity Federation (OIDC token).
permissions:
  contents: read
  id-token: write

env:
  REGION: asia-east1
  REPO: carbon-assistant
  IMAGE_NAME: carbon-assistant

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to GCP (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Build and push image (tagged with git SHA)
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${REPO}/${IMAGE_NAME}:${GITHUB_SHA}"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      # Backend bucket is configured in terraform/backend.tf (manual, task 1.2).
      #
      # CI applies ONLY the Cloud Run Service + Job (the app layer) via -target.
      # Foundational infrastructure (service accounts, IAM bindings, Secret
      # Manager, WIF, buckets, Artifact Registry repo) is managed by a human
      # running `terraform apply` locally with owner credentials — it rarely
      # changes and should not be rewritable by CI. This keeps the deployer SA
      # least-privilege: it can roll a new image but cannot escalate IAM/WIF.
      # The targeted resources' dependencies (runtime SA, secrets, shared
      # bucket) are read-only refreshed, hence the deployer needs viewer-level
      # access to those plus actAs on the runtime SA (see design.md).
      - name: Terraform init & apply (Cloud Run app layer only)
        working-directory: terraform
        run: |
          terraform init
          terraform apply -auto-approve \
            -target=google_cloud_run_v2_service.web \
            -target=google_cloud_run_v2_job.sync \
            -var="project_id=${{ secrets.GCP_PROJECT_ID }}" \
            -var="region=${REGION}" \
            -var="image_tag=${GITHUB_SHA}" \
            -var="github_repository=${GITHUB_REPOSITORY}"
