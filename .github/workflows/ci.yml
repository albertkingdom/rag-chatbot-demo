name: CI

# Runs the automated checks on every pull request and every push to master.
# Deployment is a separate workflow (deploy.yml, release/** only).
on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      # Same hash-locked file as the Dockerfile. The tests need neither the
      # reranker model nor the jieba dictionary, so neither is downloaded.
      - name: Install dependencies
        run: pip install --require-hashes -r requirements.txt

      - name: Run pytest
        run: python -m pytest tests -q

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Same pnpm version as the Dockerfile's frontend build stage.
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      # build runs typecheck first (see package.json).
      - name: Typecheck and build
        run: pnpm build

      - name: Test
        run: pnpm exec vitest run --maxWorkers=1

  terraform:
    name: Terraform validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Check formatting
        run: terraform fmt -check -recursive

      # -backend=false: no state access or credentials are needed to validate.
      - name: Validate
        run: |
          terraform init -backend=false -input=false
          terraform validate
